# /etc/nginx/sites-available/fypilot-backend
# Nginx reverse proxy config for FYPilot Backend
# Certbot will auto-modify this file to add SSL

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# Upstream backend
upstream fypilot_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    # CHANGE THIS to your actual domain
    server_name api.fypilot.com;

    # Certbot challenge (leave this for SSL setup)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS (uncomment after SSL is set up)
    # return 301 https://$server_name$request_uri;

    # ─── Proxy to Backend ───────────────────────────────────
    location / {
        # Rate limiting
        limit_req zone=api burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://fypilot_backend;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for SSE/streaming)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;  # Higher for long-running AI requests

        # Buffering
        proxy_buffering off;  # Required for SSE
        proxy_cache off;
    }

    # ─── Health check (no rate limiting) ────────────────────
    location /api/health {
        proxy_pass http://fypilot_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ─── Security headers ──────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Deny access to hidden files ───────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    # ─── Request size limit ────────────────────────────────
    client_max_body_size 50M;

    # ─── Gzip compression ─────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/json
        application/javascript
        text/plain
        text/css;
}

# ─── HTTPS server block (Certbot will generate this) ──────
# After running: sudo certbot --nginx -d api.fypilot.com
# Certbot will automatically add an HTTPS server block here
