# Render Blueprint for FYPilot Backend
# This file defines your entire infrastructure as code

services:
# FastAPI Web Service
- type: web
  name: fypilot-backend
  runtime: python
  region: singapore # Change to: oregon, frankfurt, singapore, etc.
  plan: free # Upgrade to 'starter' for production ($7/month)
  branch: sudais-dev # Deploy from sudais-dev branch
  buildCommand: |
    pip install --upgrade pip
    pip install -r requirements.txt
  startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
  healthCheckPath: /api/health

  envVars:
  # Python Version
  - key: PYTHON_VERSION
    value: "3.11.0"

  # Database (auto-linked to database below)
  - key: DATABASE_URL
    fromDatabase:
      name: fypilot-db
      property: connectionString

  # Environment
  - key: ENV
    value: production

  # JWT Configuration
  - key: JWT_SECRET
    generateValue: true # Auto-generates secure random string
  - key: JWT_ALGORITHM
    value: HS256

  # Session Secret
  - key: SESSION_SECRET
    generateValue: true # Auto-generates secure random string

  # Frontend URLs (UPDATE THESE!)
  - key: FRONTEND_APP_URL
    value: https://your-frontend.vercel.app # CHANGE THIS
  - key: OAUTH_REDIRECT_ORIGIN
    sync: false # Will be auto-set to your Render URL

  # Feature Flags
  - key: ENABLE_REQUEST_ID
    value: "true"
  - key: ENABLE_SECURITY_HEADERS
    value: "true"
  - key: ENABLE_SESSIONS
    value: "false"

  # Mailer Configuration (UPDATE THESE!)
  - key: MAILER_PROVIDER
    value: mailtrap
  - key: MAILTRAP_SMTP_HOST
    value: sandbox.smtp.mailtrap.io
  - key: MAILTRAP_SMTP_PORT
    value: "2525"
  - key: MAILTRAP_SMTP_USER
    sync: false # Add manually in dashboard
  - key: MAILTRAP_SMTP_PASS
    sync: false # Add manually in dashboard

  # Supabase (UPDATE THESE!)
  - key: SUPABASE_URL
    sync: false # Add manually in dashboard
  - key: SUPABASE_KEY
    sync: false # Add manually in dashboard

  # Google OAuth (UPDATE THESE!)
  - key: GOOGLE_CLIENT_ID
    sync: false # Add manually in dashboard
  - key: GOOGLE_CLIENT_SECRET
    sync: false # Add manually in dashboard

  # GitHub OAuth (Optional)
  - key: GITHUB_CLIENT_ID
    sync: false # Add manually in dashboard (optional)
  - key: GITHUB_CLIENT_SECRET
    sync: false # Add manually in dashboard (optional)

databases:
# PostgreSQL Database
- name: fypilot-db
  databaseName: fypilot
  user: fypilot_user
  plan: free # Upgrade to 'starter' for production ($7/month)
  region: singapore # Must match web service region
  ipAllowList: [] # Empty = allow all IPs (required for Render services)
