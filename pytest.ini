# pytest.ini
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Markers
markers =
    integration: marks tests that need external services
    unit: marks pure unit tests
    slow: marks tests as slow (deselect with '-m "not slow"')
    asyncio: asyncio tests (pytest-asyncio)

# Console output
addopts =
    --alluredir=allure-results/pytest
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p pytest_asyncio
    -p no:mcp_eval
