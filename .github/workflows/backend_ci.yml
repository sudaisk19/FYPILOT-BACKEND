# .github/workflows/backend-ci.yml
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Backend CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name:  Lint · Type-check · Migrate · Test
    runs-on: ubuntu-latest

    # ─── Point at your remote Supabase DB ───
    # Make sure your secret DATABASE_URL is:
    # postgresql+psycopg2://postgres:<PASS>@db.yourproject.supabase.co:5432/postgres?sslmode=require
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
      JWT_SECRET:    ${{ secrets.JWT_SECRET }}
      JWT_ALGORITHM: ${{ secrets.JWT_ALGORITHM }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies & dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black isort mypy alembic psycopg2-binary

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

    #   - name: Run Alembic migrations
    #     run: alembic upgrade head

      - name: Lint with flake8
        run: python -m flake8 app/ 

      - name: Format check with black
        run: python -m black --check .

      - name: Import sorting check with isort
        run: python -m isort --check .
    #   - name: Import sorting check with isort
    #     run: python -m isort --check .

      - name: Type-check with mypy
        run: python -m mypy app/

      - name: Run unit tests
        run: pytest tests/unit --maxfail=1 --disable-warnings -q

      - name: Coverage report
        run: pytest --cov=app --cov-report=term-missing

  docker:

    name:  Build & Push Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/backend:latest
            ghcr.io/${{ github.repository_owner }}/backend:${{ github.sha }}