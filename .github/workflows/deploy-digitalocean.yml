# .github/workflows/deploy-digitalocean.yml
# CI/CD Pipeline: Test → Build → Push to GHCR → Deploy to DigitalOcean Droplet
# Triggers on push to 'main' branch

name: Deploy to DigitalOcean

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/fypilot-backend

jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1: Lint + Type-check
  # ──────────────────────────────────────────────────────────
  lint:
    name: 🧹 Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Format check (black)
        run: python -m black --check .

      - name: Type-check (mypy)
        run: python -m mypy app/ --ignore-missing-imports

  # ──────────────────────────────────────────────────────────
  # Job 2: Run Tests
  # ──────────────────────────────────────────────────────────
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Minimal env vars for tests (tests use mocks, not real services)
      DATABASE_URL: "postgresql://test:test@localhost:5432/test"
      SUPABASE_URL: "https://test.supabase.co"
      SUPABASE_KEY: "test-key"
      JWT_SECRET: "test-jwt-secret-for-ci"
      JWT_ALGORITHM: "HS256"
      SESSION_SECRET: "test-session-secret-for-ci"
      GOOGLE_CLIENT_ID: "test-google-client-id"
      GOOGLE_CLIENT_SECRET: "test-google-client-secret"
      MAILTRAP_SMTP_USER: "test-smtp-user"
      MAILTRAP_SMTP_PASS: "test-smtp-pass"
      REDIS_URL: "redis://localhost:6379/0"
      ENV: "testing"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --maxfail=5 \
            --disable-warnings \
            -v \
            --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ──────────────────────────────────────────────────────────
  # Job 3: Build & Push Docker Image
  # ──────────────────────────────────────────────────────────
  build:
    name: 🐳 Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    # Only build on push to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────
  # Job 4: Deploy to DigitalOcean Droplet
  # ──────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to DigitalOcean
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Uncomment the next line after creating a 'production' environment in
    # GitHub → Settings → Environments (enables deploy approvals & env-scoped secrets)
    # environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Check if deploy secrets are configured
        id: check
        run: |
          if [ -z "${{ secrets.DO_HOST }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭️ DO_HOST secret not set — skipping deploy"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSH
        if: steps.check.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          script: |
            set -e

            echo "🚀 Starting deployment..."

            # Navigate to project directory
            cd /opt/fypilot-backend

            # Pull latest docker image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest

            # Stop existing containers gracefully
            docker compose down --timeout 30

            # Start new containers
            docker compose up -d

            # Wait for health check
            echo "⏳ Waiting for health check..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8000/api/health > /dev/null 2>&1; then
                echo "✅ Application is healthy!"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "❌ Health check failed after 30 attempts"
                docker compose logs --tail=50
                exit 1
              fi
              echo "  Attempt $i/30 - waiting..."
              sleep 2
            done

            # Clean up old images
            docker image prune -f

            echo "🎉 Deployment complete!"
